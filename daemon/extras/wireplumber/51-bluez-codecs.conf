## OpenPods: prefer high-quality bluez codecs.
##
## - bluez5.codecs picks A2DP codec preference for output. AAC first
##   (the only one AirPods supports beyond SBC), then SBC XQ (higher
##   bitrate SBC; some Apple firmware tolerates it), then SBC as last
##   resort.
## - bluez5.enable-msbc=true allows the wideband (16 kHz) HFP codec for
##   mic input instead of falling back to 8 kHz CVSD. AirPods mics sound
##   acceptable on mSBC; AM-radio on CVSD.
## - bluez5.enable-hw-volume=true routes volume changes to the device
##   firmware so the AirPods' physical volume controls follow the
##   system stream level.
## - bluez5.hfphsp-backend=native uses WirePlumber's own HFP/HSP stack
##   instead of an external one (oFono).
##
## Install:
##   cp 51-bluez-codecs.conf ~/.config/wireplumber/wireplumber.conf.d/
##   systemctl --user restart wireplumber
##   # Reconnect AirPods and verify with:
##   pactl list sinks | grep -iE 'codec|api.bluez5'

monitor.bluez.properties = {
  bluez5.codecs = [ aac sbc_xq sbc ]
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend = native
}
